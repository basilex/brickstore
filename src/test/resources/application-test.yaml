spring:
  main:
    banner-mode: off
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
  application:
    name: brickstore-test
  datasource:
    url: jdbc:postgresql://localhost:5432/brickstore_test
    driver-class-name: org.postgresql.Driver
    username: system
    password: passw0rd
    hikari:
      auto-commit: true
      maximum-pool-size: 5
  test:
    database:
      replace: NONE
  flyway:
    clean-disabled: false
    cleanDisabled: false
    baseline-on-migrate: true
    validate-on-migrate: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: none
management:
  endpoints:
    web:
      base-path: /api/v1/actuator
      exposure:
        include:
          - env
          - info
          - beans
          - health
          - metrics
          - loggers
          - mappings
          - prometheus
          - threaddump
          - conditions
          - httpexchanges
  endpoint:
    info:
      access: read-only
    health:
      show-details: always
    metrics:
      access: read-only
    loggers:
      access: read-only
  info:
    build:
      enabled: true
