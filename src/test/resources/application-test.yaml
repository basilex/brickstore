spring:
  main:
    banner-mode: off
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
  application:
    name: brickstore-test
  datasource:
    url: jdbc:h2:mem:brickstore_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
    hikari:
      auto-commit: true
      maximum-pool-size: 5
  test:
    database:
      replace: NONE
  flyway:
    clean-disabled: false
    cleanDisabled: false
    baseline-on-migrate: true
    validate-on-migrate: false
    enabled: false
    locations: classpath:db/migration
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  jpa:
    hibernate:
      ddl-auto: none
management:
  endpoints:
    web:
      base-path: /api/v1/actuator
      exposure:
        include:
          - env
          - info
          - beans
          - health
          - metrics
          - loggers
          - mappings
          - prometheus
          - threaddump
          - conditions
          - httpexchanges
  endpoint:
    info:
      access: read-only
    health:
      show-details: always
    metrics:
      access: read-only
    loggers:
      access: read-only
  info:
    build:
      enabled: true
