server:
  port: 8081

spring:
  main:
    banner-mode: console
  banner:
    location: classpath:banner-dev.txt
  datasource:
    url: jdbc:postgresql://localhost:5432/brickstore_dev
    username: system
    password: passw0rd
    hikari:
      auto-commit: true
      maximum-pool-size: 10
  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      base-path: /api/v1/actuator
      exposure:
        include:
          - env
          - info
          - beans
          - health
          - metrics
          - loggers
          - mappings
          - prometheus
          - threaddump
          - conditions
          - httpexchanges
  endpoint:
    info:
      access: read-only
    health:
      show-details: always
    metrics:
      access: read-only
    loggers:
      access: read-only
  info:
    build:
      enabled: true
